<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta http-equiv="refresh" content="0; url=https://ev.braip.com/pv/lip7nddp/afig51lzvj/?src=GP10">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mounjax – Oferta Oficial</title>

  <!-- OG / Preview -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Mounjax – Oferta Oficial (Site Verificado)">
  <meta property="og:description" content="Você está indo para a página oficial do Mounjax com segurança.">
  <meta property="og:image" content="https://mounjax.com/pvmonob/imagens/mounjax.webp">
  <meta property="og:url" content="https://queromounjax.site/comprar">

  <meta name="twitter:card" content="summary_large_image">

  <style>
    body{
      margin:0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #3b0064 0%, #12001f 70%);
      color:#fff;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:flex-start;
    }

    .wrap{
      width:100%;
      max-width:420px;
      padding:26px 18px;
      text-align:center;
    }

    .badge{
      display:inline-block;
      background: rgba(0,255,140,.18);
      border:1px solid rgba(0,255,140,.35);
      padding:7px 12px;
      border-radius:999px;
      font-size:13px;
      font-weight:800;
      margin-top:10px;
    }

    h1{
      font-size:30px;
      font-weight:900;
      line-height:1.1;
      margin:18px 0 14px;
    }

    p{
      font-size:16px;
      line-height:1.4;
      opacity:.95;
      margin:0 auto 24px;
      max-width:360px;
    }

    .btn{
      width:100%;
      border:none;
      background: linear-gradient(180deg, #29d85b, #16a941);
      color:white;
      font-size:18px;
      font-weight:900;
      padding:18px 18px;
      border-radius:18px;
      text-decoration:none;
      display:block;
      box-shadow: 0 16px 30px rgba(0,0,0,.35);
      margin-bottom:18px;
    }

    .sub{
      font-size:13px;
      opacity:.8;
      margin-top:10px;
    }

    .icons{
      display:flex;
      justify-content:space-between;
      gap:10px;
      margin-top:18px;
      font-size:11px;
      opacity:.85;
    }

    .icon{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:6px;
      flex:1;
      text-align:center;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <div class="badge">✅ Site oficial verificado</div>

    <h1 id="headline">Carregando...</h1>

    <p id="subheadline">
      Aguarde… estamos preparando o acesso oficial.
    </p>

    <a class="btn" id="btnComprar" href="#">
      🛒 COMPRAR AGORA
    </a>

    <div class="sub" id="redirectMsg">Você será redirecionado automaticamente em instantes…</div>

    <div class="icons">
      <div class="icon">🔒<div>SEUS DADOS<br/>PROTEGIDOS</div></div>
      <div class="icon">💳<div>ACEITAMOS<br/>CARTÕES</div></div>
      <div class="icon">✅<div>COMPRA<br/>100% SEGURA</div></div>
    </div>

  </div>

<script>
(async function() {
  // ✅ Carrega o config
  const cfg = await fetch("/config.json").then(r=>r.json()).catch(()=>null);
  if(!cfg) return;

  // ✅ atualiza textos
  document.title = cfg.productName + " – Oferta Oficial";
  document.getElementById("headline").innerText = cfg.headline;
  document.getElementById("subheadline").innerText = cfg.subheadline;

  // ✅ cria event_id único
  const eventId = "mounjax-" + Date.now() + "-" + Math.random().toString(16).slice(2);

  // ✅ captura fbp/fbc
  function getCookie(name) {
    const v = document.cookie.match("(^|;)\\s*" + name + "\\s*=\\s*([^;]+)");
    return v ? v.pop() : "";
  }
  function getFbpFbc() {
    const fbp = getCookie("_fbp") || "";
    let fbc = getCookie("_fbc") || "";
    const params = new URLSearchParams(window.location.search || "");
    const fbclid = params.get("fbclid");
    if (!fbc && fbclid) fbc = `fb.1.${Date.now()}.${fbclid}`;
    return { fbp, fbc };
  }
  const { fbp, fbc } = getFbpFbc();

  // ✅ monta link final com parâmetros
  const u = new URL(cfg.monetizzeLink);
  if(fbp) u.searchParams.set("fbp", fbp);
  if(fbc) u.searchParams.set("fbc", fbc);
  u.searchParams.set("event_id", eventId);
  u.searchParams.set("external_id", "redirect-" + eventId);

  // ✅ botão manual
  document.getElementById("btnComprar").href = u.toString();

  // ✅ envia InitiateCheckout pro Worker principal (SERVER)
  const payload = {
    event: "InitiateCheckout",
    event_id: eventId,
    external_id: "redirect-" + eventId,
    event_source_url: window.location.href,
    custom_data: {
      source: "redirect",
      product: cfg.productName,
      fbp, fbc
    }
  };

  try {
    fetch(cfg.workerMeta, {
      method:"POST",
      headers:{ "content-type":"application/json" },
      body: JSON.stringify(payload),
      keepalive:true
    }).catch(()=>{});
  } catch(e){}

  // ✅ redireciona automático
  setTimeout(() => {
    window.location.href = u.toString();
  }, (Number(cfg.redirectSeconds || 2) * 1000));

})();
</script>

</body>
</html>
